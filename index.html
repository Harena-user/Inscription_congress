<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <title>Inscription au congrès</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="form-card">

            <h1>VIIè CONGRES DE LA SOCIETE DE CHIRURGIE MAXILLO-FACIALE DE MADAGASCAR</h1>

            <p class="intro">
                Veuillez remplir le formulaire ci-dessous.
            </p>


            <form id="registrationForm" novalidate>

                <!-- =========================
                     NOM
                ========================== -->

                <div class="form-group">

                    <label for="nom">
                        Nom <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        autocomplete="family-name"
                        maxlength="100"
                        required
                    >

                    <small
                        id="nomError"
                        class="error"
                    ></small>

                </div>


                <!-- =========================
                     PRÉNOM(S)
                ========================== -->

                <div class="form-group">

                    <label for="prenoms">
                        Prénom(s) <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="prenoms"
                        name="prenoms"
                        autocomplete="given-name"
                        maxlength="150"
                        required
                    >

                    <small
                        id="prenomsError"
                        class="error"
                    ></small>

                </div>


                <!-- =========================
                     EMAIL
                ========================== -->

                <div class="form-group">

                    <label for="email">
                        Adresse e-mail <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        maxlength="254"
                        required
                    >

                    <small
                        id="emailError"
                        class="error"
                    ></small>

                </div>


                <!-- =========================
                     TÉLÉPHONE
                ========================== -->

                <div class="form-group">

                    <label for="telephone">
                        Numéro de téléphone <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        id="telephone"
                        name="telephone"
                        placeholder="030 00 000 00"
                        autocomplete="tel"
                        maxlength="14"
                        required
                    >

                    <small
                        id="telephoneError"
                        class="error"
                    ></small>

                </div>


                <!-- =========================
                     FONCTION
                ========================== -->

                <div class="form-group">

                    <label for="fonction">
                        Fonction <span class="required">*</span>
                    </label>

                    <select
                        id="fonction"
                        name="fonction"
                        required
                    >

                        <option
                            value=""
                            selected
                            disabled
                        >
                            -- Sélectionnez votre fonction --
                        </option>

                        <option value="Médecin/Chirurgien dentiste">
                            Médecin/Chirurgien dentiste
                        </option>

                        <option value="Infirmier(e)">
                            Infirmier(e)
                        </option>

                        <option value="Étudiant">
                            Étudiant
                        </option>

                        <option value="Autres">
                            Autres
                        </option>

                    </select>

                    <small
                        id="fonctionError"
                        class="error"
                    ></small>

                </div>


                <!-- =========================
                     AUTRE FONCTION
                ========================== -->

                <div
                    class="form-group hidden"
                    id="autreFonctionGroup"
                >

                    <label for="autreFonction">
                        Précisez votre fonction
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="autreFonction"
                        name="autreFonction"
                        maxlength="150"
                    >

                    <small
                        id="autreFonctionError"
                        class="error"
                    ></small>

                </div>


                <!-- =========================
                     DROIT D'INSCRIPTION
                ========================== -->

                <div
                    id="fraisInscription"
                    class="fee-box hidden"
                    aria-live="polite"
                >
                    <strong>Droit d'inscription :</strong>

                    <span id="montantInscription"></span>
                </div>


                <!-- =========================
                     CONTACT PAIEMENT
                ========================== -->

                <div class="contact-info">

                    <p>
                        Pour souscrire, veuillez effectuer le paiement au :
                    </p>

                    <strong>
                        034 79 707 94 (Dr Iavosoa)
                    </strong>

                </div>


                <!-- =========================
                     MESSAGE GLOBAL
                ========================== -->

                <p
                    id="formMessage"
                    class="form-message"
                    aria-live="polite"
                ></p>


                <!-- =========================
                     BOUTON
                ========================== -->

                <button
                    type="submit"
                    id="submitButton"
                >
                    S'inscrire
                </button>

            </form>

        </section>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="script.js"></script>

</body>

</html>
